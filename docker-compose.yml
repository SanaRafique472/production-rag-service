# Full local stack: PostgreSQL + Qdrant + API + web UI.
#   cp .env.example .env        # add COHERE_API_KEY, ANTHROPIC_API_KEY and a JWT_SECRET_KEY
#   docker compose up --build   # UI: http://localhost:8080   API docs: http://localhost:8000/docs
# Only databases (for `make dev`):  docker compose up -d postgres qdrant
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]

volumes:
  pgdata:
  qdrant_data:
